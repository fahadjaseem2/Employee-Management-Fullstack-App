name: CI Workflow for WorkforceOps
on:
  workflow_call:
  
jobs:
  code-quality:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm # Automatically caches dependencies for faster runner speeds
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      #- name: Run Linter
        #run: npm run lint

      - name: Run prettier 
        run: npm run format
      # If your format script uses --write, it will modify files during CI, which isn't ideal.

      #- name: Check Prettier formatting
        #run: npx prettier --check .

      #- name: Run Test
        #run: npm test

      #- name: Build frontend
        #run: npm run build