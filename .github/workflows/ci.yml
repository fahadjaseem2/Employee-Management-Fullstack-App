name: CI Workflow for WorkforceOps
on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - dev
  
jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm # Automatically caches dependencies for faster runner speeds
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      #- name: Run Linter
        #run: npm run lint

      - name: Run prettier 
        run: npm run format
      # If your format script uses --write, it will modify files during CI, which isn't ideal.

      #- name: Check Prettier formatting
        #run: npx prettier --check .

      #- name: Run Test
        #run: npm test

      #- name: Build frontend
        #run: npm run build

  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Code checkout
        uses: actions/checkout@v4
      
      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: Download Maven dependencies
        run: mvn -B dependency:resolve dependency:resolve-plugins

      - name: Run Test 
        run: mvn -B test

  Docker-Build-and-Push:
    needs:
      - frontend
      - backend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        working-directory:
          - frontend
          - backend

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      #- name: Setup QEMU
        #uses: docker/setup-qemu-action@v4
      # use for multi architecture,right now i dont need because its build on one arch.
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      #- name: Setup docker
        #uses: docker/setup-docker-action@v5

      - name: docker login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: docker build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.working-directory }}
          push: true
          tags: ${{ vars.DOCKER_USERNAME }}/workforceops-${{ matrix.working-directory }}:${{ github.sha }}




        
