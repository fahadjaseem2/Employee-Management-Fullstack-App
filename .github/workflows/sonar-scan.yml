name: Sonar Qube Scan

on:   
  workflow_call:

jobs:
  runs-on: ubuntu-latest
  steps:
    - name: Code checkout
      uses: actions/checkout@v6
      with: 
        fetch-depth: 0

    - name: SonarQube scan
      uses: SonarSource/sonarqube-scan-action@v8.2.1 # Ex: v4.1.0 or sha1, See the latest version at https://github.com/marketplace/actions/official-sonarqube-scan
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        