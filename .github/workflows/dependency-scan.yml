name: Dependecy Scan using trivy

on: workflow_call

jobs:
  runs-on: ubuntu-latest
  steps:
    - name: code checkout
      uses: actions/checkout@v6

    - name: Scan Node.js dependencies
      uses: aquasecurity/trivy-action@0.28.0
      with:
        scan-type: fs # fs= file system
        scan-ref: .
        format: table #This controls how the scan results are displayed. in table format. other formats are json, sarif, cyclonedx, template etc.



      

    