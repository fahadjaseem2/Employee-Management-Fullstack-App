name: Dependecy Scan using trivy

on: workflow_call

jobs:
  Dependecy-check:
    runs-on: ubuntu-latest
    steps:


      - name: code checkout
        uses: actions/checkout@v4

      - name: Scan Node.js dependencies
        uses: aquasecurity/trivy-action@v0.36.0 > vul-report.txt
        with:
          scan-type: 'fs' # fs= file system
          scan-ref: '.' # scan from root that include frontend and backend
          #trivy-config: trivy.yaml # "Instead of specifying all the options in the workflow, read them from the trivy.yaml configuration file."
          scanners: vuln
          severity: HIGH,CRITICAL
          # format: 'json' #This controls how the scan results are displayed. in table format. other formats are json, sarif, cyclonedx, template etc.
          # output: trivy-report.json
          exit-code: 1

      - name: upload report to artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-report
          path: reports/vul-report.txt
          retention-days: 5

      # - name: Upload Job Report
