# # Disable authentication (good for local development)
# auth_enabled: false  # false → Anyone can access Loki.

# # Loki HTTP server configuration
# server:
#   http_listen_port: 3100   # Loki listens on port 3100

# # Common settings shared by Loki components
# common:
#   ring:
#     instance_addr: 127.0.0.1   # Local instance address
#     kvstore:
#       store: inmemory          # Store cluster info in memory (single-node setup)

#   replication_factor: 1        # Keep one copy of each log
#   path_prefix: /loki           # Base directory for Loki data

# # Define how logs are indexed and stored
# schema_config:
#   configs:
#     - from: "2020-10-24"       # Schema active from this date
#       store: tsdb              # Use TSDB index format
#       object_store: filesystem # Store logs on local filesystem
#       schema: v13              # Loki schema version
#       index:
#         prefix: index_         # Index file prefix
#         period: 24h            # Create a new index every 24 hours

# # Configure where log chunks are stored
# storage_config:
#   filesystem:
#     directory: /loki/chunks    # Store log data here

# Disable authentication (good for local development)
auth_enabled: false

server:
  http_listen_port: 3100

common:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
  replication_factor: 1
  path_prefix: /loki

schema_config:
  configs:
    - from: "2020-10-24"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /loki/chunks

limits_config:
  allow_structured_metadata: false

analytics:
  reporting_enabled: false